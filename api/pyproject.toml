[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "eterzion_upscale"
version = "1.2.0"
description = "Upscale de imagens e vídeos com IA, sem dependência de BasicSR"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
keywords = ["super-resolution", "upscale", "pytorch", "image-restoration", "video"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "numpy>=2.5",
    "opencv-python>=5.0",
    "python-ffmpeg>=2.0",
    "spandrel>=0.4",
    "torch>=2.13",
    "torchaudio>=2.11",
    "tqdm",
    "psutil>=7.2",
    "nvidia-ml-py>=13.0",
    # Ver a nota em eterzion_upscale_api/requirements.txt: substituiram o
    # librosa, que arrastava numba/llvmlite/scikit-learn -- ~195 MB.
    "soxr>=1.0",
    "soundfile>=0.13",
]

[project.optional-dependencies]
audio = [
    # denoiser (CC-BY-NC-4.0), voicefixer's unlicensed vocoder checkpoint and
    # the retired external astros_audio_enhance repository were removed. DSP
    # (afftdn/loudnorm) remains built in, while AudioSR provides the approved
    # speech bandwidth-extension path.
    "audiosronnx==0.9.0a2",  # Apache-2.0 code and weights — speech bandwidth extension (pinned: alpha)
    "onnxruntime==1.30.0",
    # SonicMaster (music restoration, approved_conditional — see MODEL_LICENSES.md §3-bis) is
    # deliberately NOT listed here: its upstream repo (github.com/AMAAI-Lab/SonicMaster) has no
    # setup.py/pyproject.toml, so `pip install git+...` never worked (T001, specs/
    # 006-audio-engine-masterizacao). It runs from a vendored subset in
    # eterzion_upscale_api/vendor/sonicmaster/, installed into its own isolated environment via
    # eterzion_upscale_api/audio_worker_requirements.txt — never as part of this extra.
]

[tool.setuptools.packages.find]
include = ["eterzion_upscale*"]

[tool.pytest.ini_options]
addopts = "eterzion_upscale/tests/"

[tool.yapf]
based_on_style = "pep8"
column_limit = 120

[tool.isort]
line_length = 120
known_first_party = ["eterzion_upscale"]
