[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "astros_upscale"
version = "1.0.0"
description = "Upscale de imagens e vídeos com IA, sem dependência de BasicSR"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
keywords = ["super-resolution", "upscale", "pytorch", "image-restoration", "video"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.9",
    "python-ffmpeg>=2.0",
    "spandrel>=0.4",
    "torch>=2.1",
    "torchaudio>=2.1",
    "tqdm",
    "psutil>=5.9",
    "nvidia-ml-py>=12.0",
    "librosa>=0.10",
]

[project.optional-dependencies]
audio = [
    # denoiser (CC-BY-NC-4.0) and voicefixer's unlicensed vocoder checkpoint were
    # removed per docs/models/MODEL_LICENSES.md — replaced by DSP (afftdn/loudnorm)
    # in astros_upscale.processing plus the two commercially-clean model paths below.
    "audiosronnx",  # Apache-2.0 code and weights — speech bandwidth extension
    "astros-audio-enhance @ git+https://github.com/ericinacio/astros_audio_enhance.git",
    # SonicMaster (music restoration, approved_conditional — see MODEL_LICENSES.md §3-bis) is
    # deliberately NOT listed here: its upstream repo (github.com/AMAAI-Lab/SonicMaster) has no
    # setup.py/pyproject.toml, so `pip install git+...` never worked (T001, specs/
    # 006-audio-engine-masterizacao). It runs from a vendored subset in
    # astros_upscale_api/vendor/sonicmaster/, installed into its own isolated environment via
    # astros_upscale_api/audio_worker_requirements.txt — never as part of this extra.
]

[tool.setuptools.packages.find]
include = ["astros_upscale*"]

[tool.pytest.ini_options]
addopts = "astros_upscale/tests/"

[tool.yapf]
based_on_style = "pep8"
column_limit = 120

[tool.isort]
line_length = 120
known_first_party = ["astros_upscale"]
