services:
  licensing:
    image: ghcr.io/eterzion/eterzion_studio/licensing:${LICENSING_IMAGE_TAG:?LICENSING_IMAGE_TAG is required}
    container_name: eterzion-studio-licensing
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ETERZION_LICENSING_DATABASE_PATH: /var/lib/eterzion-studio/licensing.db
      ETERZION_LICENSING_IDENTITY_DIR: /var/lib/eterzion-studio/identity
      ETERZION_LICENSING_PORT: '8766'
    volumes:
      - ./storage:/var/lib/eterzion-studio
    networks:
      - eterzion_proxy
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8766/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 6

networks:
  eterzion_proxy:
    external: true
