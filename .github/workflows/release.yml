name: Release

on:
  push:
    branches: [main]
    paths:
      - interface/package.json
      - api/pyproject.toml
      - api/astros_upscale/__init__.py
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a7c2a10549f112af0dc3ec4e9093277505920566 # v6
        with:
          python-version: "3.13"
      - name: Validate synchronized versions
        id: version
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./interface/package.json').version")"
          python_version="$(python -c "import tomllib; print(tomllib.load(open('api/pyproject.toml','rb'))['project']['version'])")"
          module_version="$(sed -nE "s/^__version__ = '([^']+)'$/\1/p" api/astros_upscale/__init__.py)"
          test "$package_version" = "$python_version"
          test "$package_version" = "$module_version"
          echo "tag=v$package_version" >> "$GITHUB_OUTPUT"
      - name: Build Python package
        run: |
          python -m pip install --disable-pip-version-check build
          python -m build api
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
            exit 0
          fi
          gh release create "$TAG" api/dist/* \
            --target "$GITHUB_SHA" \
            --title "Astros Upscale $TAG" \
            --generate-notes \
            --repo "$GITHUB_REPOSITORY"
