name: Release

on:
  push:
    branches: [main]
    paths:
      - api/**
      - interface/**
      - models/**
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Os jobs Linux caem no runner auto-hospedado quando ele esta online e no
  # ubuntu-24.04 quando nao esta. Nao ha guarda de fork aqui porque este
  # workflow so dispara em push para main e workflow_dispatch.
  #
  # O instalador do Windows tem variavel propria, `RUNNER_LABELS_WINDOWS`, e
  # nao pode usar a dos jobs Linux: sao maquinas diferentes dentro do mesmo
  # desktop -- cinco runners no WSL e um servico nativo do Windows. Uma
  # variavel so faria um cair na fila do outro.
  #
  # O runner Windows e servico com inicio automatico, entao esta no ar sempre
  # que a maquina esta ligada, enquanto a variavel segue o ciclo do start.sh
  # (logon a logoff). Deslogado, o job vai para o windows-latest mesmo com o
  # runner local disponivel: desperdicio, nunca erro.
  prepare:
    name: Prepare release
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["ubuntu-24.04"]') }}
    outputs:
      exists: ${{ steps.release.outputs.exists }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Validate synchronized versions
        id: version
        run: |
          set -euo pipefail
          # Lido com o Python que este job ja configura, e nao com `node -p`: o
          # job nunca teve setup-node e so funcionava porque a imagem da GitHub
          # traz Node pre-instalado. Num runner auto-hospedado enxuto isso
          # falha com "node: command not found".
          package_version="$(python -c "import json; print(json.load(open('interface/package.json'))['version'])")"
          python_version="$(python -c "import tomllib; print(tomllib.load(open('api/pyproject.toml','rb'))['project']['version'])")"
          module_version="$(sed -nE "s/^__version__ = '([^']+)'$/\1/p" api/eterzion_upscale/__init__.py)"
          test "$package_version" = "$python_version"
          test "$package_version" = "$module_version"
          echo "tag=v$package_version" >> "$GITHUB_OUTPUT"
      - name: Prevent duplicate release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping all build jobs."
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi

  python-package:
    name: Build Python package
    needs: prepare
    if: needs.prepare.outputs.exists != 'true'
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["ubuntu-24.04"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check build
      - run: python -m build api
      - uses: actions/upload-artifact@v7
        with:
          name: python-package
          path: api/dist/*
          if-no-files-found: error

  windows-installer:
    name: Build Windows installer
    needs: prepare
    if: needs.prepare.outputs.exists != 'true'
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS_WINDOWS || '["windows-latest"]') }}
    timeout-minutes: 120
    outputs:
      signed: ${{ steps.signing.outputs.signed }}
    env:
      # Assinatura de código é o caminho esperado: um release sem assinatura sai
      # parecendo pronto e cada usuário encontra o aviso do SmartScreen na
      # primeira execução — o custo aparece na conversão, longe de quem publicou.
      #
      # Este job costumava **falhar** sem os segredos. Desde 05/09/2026 ele
      # publica assim mesmo, por decisão do responsável, mas nunca em silêncio:
      # emite aviso no log, pula a verificação de assinatura e a release sai
      # marcada como não assinada. O objetivo do gate original era que ninguém
      # descobrisse a ausência pelo usuário final; isso continua valendo.
      #
      # `CSC_IDENTITY_AUTO_DISCOVERY` fica desligado porque ele faz o
      # electron-builder procurar certificado no chaveiro da máquina, e um
      # runner efêmero não tem nenhum.
      CSC_LINK: ${{ secrets.WINDOWS_CERT_BASE64 }}
      CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: api/eterzion_upscale_api/requirements*.txt
      - uses: pnpm/action-setup@v6.0.10
        with:
          version: 11
          # Mesmo motivo do tests.yml: os runners locais dividem o $HOME e o
          # destino padrao sofre corrida entre jobs concorrentes.
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.job }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: interface/pnpm-lock.yaml
      - name: Create isolated Python environment
        shell: pwsh
        run: uv venv --clear .venv --python python
      - name: Install CPU PyTorch stack
        shell: pwsh
        run: >-
          uv pip install --python .venv/Scripts/python.exe
          torch torchvision torchaudio
          --index-url https://download.pytorch.org/whl/cpu
      - name: Install backend build dependencies
        shell: pwsh
        run: |
          uv pip install --python .venv/Scripts/python.exe -r api/eterzion_upscale_api/requirements.txt
          uv pip install --python .venv/Scripts/python.exe --no-deps -e api
          uv pip install --python .venv/Scripts/python.exe pyinstaller==6.14.1
      - name: Install desktop dependencies
        working-directory: interface
        run: pnpm install --frozen-lockfile

      # O PyInstaller empacotando o PyTorch e' ~4,5 dos ~7 minutos do release
      # inteiro, e o executavel so muda quando o codigo Python, o `.spec` ou os
      # requirements mudam. A chave cobre exatamente essas entradas: um release
      # que mexeu so no frontend restaura em segundos.
      #
      # A pasta e' grande (PyTorch empacotado), entao a primeira gravacao custa
      # alguns minutos. Compensa porque a maioria dos releases nao toca o
      # backend; se um dia tocar sempre, o cache vira so custo e vale medir de
      # novo.
      - name: Cache do backend empacotado
        uses: actions/cache@v4
        with:
          path: interface/resources/backend/win32
          key: backend-win32-py313-pyinstaller6.14.1-${{ hashFiles('api/**/*.py', 'api/**/*.spec', 'api/**/requirements*.txt', 'api/pyproject.toml') }}

      - name: Detect signing credentials
        id: signing
        shell: pwsh
        run: |
          # Decidido aqui, antes de duas horas de build, e não no fim: descobrir
          # depois do PyInstaller custa o dobro do tempo e chega como erro do
          # electron-builder, que não diz o que fazer.
          #
          # Os dois segredos andam juntos. Um só configurado quase sempre é
          # engano — o electron-builder falharia no meio — então isso continua
          # sendo erro, ao contrário de nenhum dos dois.
          $temLink = [bool]$env:CSC_LINK
          $temSenha = [bool]$env:CSC_KEY_PASSWORD
          if ($temLink -ne $temSenha) {
            throw 'Configure WINDOWS_CERT_BASE64 e WINDOWS_CERT_PASSWORD juntos, ou nenhum dos dois.'
          }
          if ($temLink) {
            Write-Output 'Credenciais de assinatura presentes; o instalador sera assinado.'
            'signed=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            Write-Output '::warning title=Instalador sem assinatura::WINDOWS_CERT_BASE64 nao esta configurado. O instalador sera publicado SEM assinatura digital e disparara o aviso do SmartScreen na maquina de cada usuario.'
            'signed=false' | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Build NSIS installer
        if: steps.signing.outputs.signed == 'true'
        working-directory: interface
        shell: pwsh
        env:
          PYTHON_EXE: ${{ github.workspace }}\.venv\Scripts\python.exe
          REUSE_BACKEND_BUILD: "1"
        run: pnpm run build:win

      - name: Build NSIS installer (sem assinatura)
        if: steps.signing.outputs.signed != 'true'
        working-directory: interface
        shell: pwsh
        env:
          PYTHON_EXE: ${{ github.workspace }}\.venv\Scripts\python.exe
          REUSE_BACKEND_BUILD: "1"
        # O `electron-builder.yml` traz `forceCodeSigning: true`, entao o script
        # normal falha sem certificado mesmo com o gate do workflow liberado. O
        # projeto ja previa esse caminho: `build:win:unsigned` desliga a flag
        # pelo caminho completo que o comentario do YAML exige e ainda nomeia o
        # artefato como `-setup-NAO-ASSINADO.exe`, para o arquivo se identificar
        # sozinho fora do contexto da release.
        run: pnpm run build:win:unsigned

      - name: Verify signature
        if: steps.signing.outputs.signed == 'true'
        working-directory: interface
        shell: pwsh
        run: |
          # Verificar em vez de assumir. Um certificado vencido, revogado ou com
          # a senha trocada produz um build verde e um instalador sem
          # assinatura; a única forma de saber é perguntar ao Windows depois do
          # fato.
          $exe = Get-ChildItem dist\*-setup.exe | Select-Object -First 1
          $sig = Get-AuthenticodeSignature $exe.FullName
          Write-Output "Instalador: $($exe.Name)"
          Write-Output "Assinatura: $($sig.Status)"
          if ($sig.SignerCertificate) {
            Write-Output "Assinado por: $($sig.SignerCertificate.Subject)"
            Write-Output "Valido ate:   $($sig.SignerCertificate.NotAfter)"
          }
          if ($sig.Status -ne 'Valid') {
            throw "O instalador saiu com assinatura '$($sig.Status)'. Nao sera publicado."
          }

      - name: Confirm the unsigned installer exists
        if: steps.signing.outputs.signed != 'true'
        working-directory: interface
        shell: pwsh
        run: |
          # Sem assinatura para verificar, ainda e' preciso confirmar que o
          # build produziu o instalador: publicar uma release vazia seria pior
          # que publicar uma sem assinatura. O nome traz NAO-ASSINADO porque o
          # `build:win:unsigned` renomeia o artefato.
          $exe = Get-ChildItem dist\*-setup-NAO-ASSINADO.exe | Select-Object -First 1
          if (-not $exe) { throw 'O build nao produziu instalador.' }
          Write-Output "Instalador: $($exe.Name)"
          Write-Output '::warning title=Instalador sem assinatura::Publicado sem assinatura digital.'

      # Este passo era copia literal do job python-package: mesmo nome de
      # artefato e mesmo caminho `api/dist/*`, que este job nunca produz. O
      # instalador recem-construido nao era enviado, entao a release sairia so
      # com o pacote Python. Passou despercebido porque o job morria antes, no
      # forceCodeSigning. O glob cobre os dois nomes possiveis, com e sem
      # assinatura, mais o blockmap que o electron-builder gera ao lado.
      - uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: interface/dist/*-setup*.exe*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [prepare, python-package, windows-installer]
    # A guarda de ref importa porque o passo abaixo usa `--target $GITHUB_SHA`:
    # sem ela, um `workflow_dispatch` numa branch qualquer publicaria uma
    # release apontando para o commit daquela branch, com a tag da versao do
    # `package.json`. Os jobs de build nao precisam da guarda -- rodar o
    # instalador numa branch e' justamente como se testa a esteira sem
    # publicar nada.
    if: >-
      needs.prepare.outputs.exists != 'true' &&
      github.ref == 'refs/heads/main'
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["ubuntu-24.04"]') }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          SIGNED: ${{ needs['windows-installer'].outputs.signed }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG was created by another run; refusing to duplicate it."
            exit 0
          fi
          gh release create "$TAG" artifacts/* \
            --target "$GITHUB_SHA" \
            --title "Eterzion Studio $TAG" \
            --generate-notes \
            --repo "$GITHUB_REPOSITORY"

          # Um instalador sem assinatura nao pode chegar ao usuario parecendo
          # igual a um assinado. O aviso vai no topo das notas, onde ele le
          # antes de baixar, e nao so no log do build que ninguem abre.
          if [ "$SIGNED" != "true" ]; then
            notas="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)"
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes "$(printf '%s\n\n%s\n' \
              '> **Instalador sem assinatura digital.** O Windows vai exibir o aviso do SmartScreen ("editor desconhecido") na primeira execução. Prossiga apenas se você confia na origem deste arquivo.' \
              "$notas")"
          fi
