name: Release

on:
  push:
    branches: [main]
    paths:
      - api/**
      - interface/**
      - models/**
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Os jobs Linux caem no runner auto-hospedado quando ele esta online e no
  # ubuntu-24.04 quando nao esta. Nao ha guarda de fork aqui porque este
  # workflow so dispara em push para main e workflow_dispatch.
  #
  # O instalador do Windows tem variavel propria, `RUNNER_LABELS_WINDOWS`, e
  # nao pode usar a dos jobs Linux: sao maquinas diferentes dentro do mesmo
  # desktop -- cinco runners no WSL e um servico nativo do Windows. Uma
  # variavel so faria um cair na fila do outro.
  #
  # O runner Windows e servico com inicio automatico, entao esta no ar sempre
  # que a maquina esta ligada, enquanto a variavel segue o ciclo do start.sh
  # (logon a logoff). Deslogado, o job vai para o windows-latest mesmo com o
  # runner local disponivel: desperdicio, nunca erro.
  prepare:
    name: Prepare release
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["ubuntu-24.04"]') }}
    outputs:
      exists: ${{ steps.release.outputs.exists }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Validate synchronized versions
        id: version
        run: |
          set -euo pipefail
          # Lido com o Python que este job ja configura, e nao com `node -p`: o
          # job nunca teve setup-node e so funcionava porque a imagem da GitHub
          # traz Node pre-instalado. Num runner auto-hospedado enxuto isso
          # falha com "node: command not found".
          package_version="$(python -c "import json; print(json.load(open('interface/package.json'))['version'])")"
          python_version="$(python -c "import tomllib; print(tomllib.load(open('api/pyproject.toml','rb'))['project']['version'])")"
          module_version="$(sed -nE "s/^__version__ = '([^']+)'$/\1/p" api/eterzion_upscale/__init__.py)"
          test "$package_version" = "$python_version"
          test "$package_version" = "$module_version"
          echo "tag=v$package_version" >> "$GITHUB_OUTPUT"
      - name: Prevent duplicate release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # A release PRIVADA e' a ultima coisa que a publicacao cria -- depois do
          # upload para o CDN (R2) e do repositorio publico da migracao. Se ela
          # existe, tudo antes dela deu certo; se algo falhou no meio, ela nao
          # existe e a proxima execucao refaz (os passos anteriores sao
          # idempotentes). Perguntar a um destino do meio pularia o build com a
          # publicacao pela metade.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping all build jobs."
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi

  windows-installer:
    name: Build and publish Windows installer
    needs: prepare
    if: needs.prepare.outputs.exists != 'true'
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS_WINDOWS || '["windows-latest"]') }}
    timeout-minutes: 120
    env:
      # Assinatura de código é o caminho esperado: um release sem assinatura sai
      # parecendo pronto e cada usuário encontra o aviso do SmartScreen na
      # primeira execução — o custo aparece na conversão, longe de quem publicou.
      #
      # Este job costumava **falhar** sem os segredos. Desde 05/09/2026 ele
      # publica assim mesmo, por decisão do responsável, mas nunca em silêncio:
      # emite aviso no log, pula a verificação de assinatura e a release sai
      # marcada como não assinada. O objetivo do gate original era que ninguém
      # descobrisse a ausência pelo usuário final; isso continua valendo.
      #
      # `CSC_IDENTITY_AUTO_DISCOVERY` fica desligado porque ele faz o
      # electron-builder procurar certificado no chaveiro da máquina, e um
      # runner efêmero não tem nenhum.
      CSC_LINK: ${{ secrets.WINDOWS_CERT_BASE64 }}
      CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      # Historico completo e tags porque a publicacao, no fim deste job, monta
      # o changelog pelo intervalo desde a release anterior.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      # O cache vem antes de tudo de proposito. O ambiente Python -- setup,
      # uv, venv, PyTorch, dependencias -- existe unicamente para CONSTRUIR o
      # executavel do backend. Quando ele e' restaurado pronto, montar esse
      # ambiente e' trabalho jogado fora: ~60s, mais a variacao do setup-uv,
      # que ja custou de 1s a 50s entre execucoes.
      #
      # A chave cobre exatamente o que muda o executavel: codigo Python, o
      # `.spec` e os requirements. Um release que mexeu so no frontend acerta.
      - name: Cache do backend empacotado
        id: backend-cache
        uses: actions/cache@v6
        with:
          path: interface/resources/backend/win32
          key: backend-win32-py313-pyinstaller6.14.1-${{ hashFiles('api/**/*.py', 'api/**/*.spec', 'api/**/requirements*.txt', 'api/pyproject.toml') }}

      - uses: actions/setup-python@v7
        if: steps.backend-cache.outputs.cache-hit != 'true'
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v10.0.1
        if: steps.backend-cache.outputs.cache-hit != 'true'
        with:
          enable-cache: true
          cache-dependency-glob: api/eterzion_upscale_api/requirements*.txt
      - uses: pnpm/action-setup@v6.0.10
        with:
          version: 11
          # Mesmo motivo do tests.yml: os runners locais dividem o $HOME e o
          # destino padrao sofre corrida entre jobs concorrentes.
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.job }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: interface/pnpm-lock.yaml
      - name: Create isolated Python environment
        if: steps.backend-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: uv venv --clear .venv --python python
      - name: Install CPU PyTorch stack
        if: steps.backend-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: >-
          uv pip install --python .venv/Scripts/python.exe
          torch torchvision torchaudio
          --index-url https://download.pytorch.org/whl/cpu
      - name: Install backend build dependencies
        if: steps.backend-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          uv pip install --python .venv/Scripts/python.exe -r api/eterzion_upscale_api/requirements.txt
          uv pip install --python .venv/Scripts/python.exe --no-deps -e api
          uv pip install --python .venv/Scripts/python.exe pyinstaller==6.14.1
      - name: Install desktop dependencies
        working-directory: interface
        run: pnpm install --frozen-lockfile

      - name: Detect signing credentials
        id: signing
        shell: pwsh
        run: |
          # Decidido aqui, antes de duas horas de build, e não no fim: descobrir
          # depois do PyInstaller custa o dobro do tempo e chega como erro do
          # electron-builder, que não diz o que fazer.
          #
          # Os dois segredos andam juntos. Um só configurado quase sempre é
          # engano — o electron-builder falharia no meio — então isso continua
          # sendo erro, ao contrário de nenhum dos dois.
          $temLink = [bool]$env:CSC_LINK
          $temSenha = [bool]$env:CSC_KEY_PASSWORD
          if ($temLink -ne $temSenha) {
            throw 'Configure WINDOWS_CERT_BASE64 e WINDOWS_CERT_PASSWORD juntos, ou nenhum dos dois.'
          }
          if ($temLink) {
            Write-Output 'Credenciais de assinatura presentes; o instalador sera assinado.'
            'signed=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            Write-Output '::warning title=Instalador sem assinatura::WINDOWS_CERT_BASE64 nao esta configurado. O instalador sera publicado SEM assinatura digital e disparara o aviso do SmartScreen na maquina de cada usuario.'
            'signed=false' | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Build NSIS installer
        if: steps.signing.outputs.signed == 'true'
        working-directory: interface
        shell: pwsh
        env:
          PYTHON_EXE: ${{ github.workspace }}\.venv\Scripts\python.exe
          REUSE_BACKEND_BUILD: "1"
        run: pnpm run build:win

      - name: Build NSIS installer (sem assinatura)
        if: steps.signing.outputs.signed != 'true'
        working-directory: interface
        shell: pwsh
        env:
          PYTHON_EXE: ${{ github.workspace }}\.venv\Scripts\python.exe
          REUSE_BACKEND_BUILD: "1"
        # O `electron-builder.yml` traz `forceCodeSigning: true`, entao o script
        # normal falha sem certificado mesmo com o gate do workflow liberado. O
        # projeto ja previa esse caminho: `build:win:unsigned` desliga a flag
        # pelo caminho completo que o comentario do YAML exige e ainda nomeia o
        # artefato como `-setup-NAO-ASSINADO.exe`, para o arquivo se identificar
        # sozinho fora do contexto da release.
        run: pnpm run build:win:unsigned

      - name: Verify the backend carries torchvision's native extension
        shell: pwsh
        run: |
          # O PyInstaller AVISA e segue quando nao acha a extensao nativa:
          #   WARNING: Hidden import "torchvision._C" not found!
          # O build fica verde, o instalador e publicado, e o backend morre no
          # primeiro import com "operator torchvision::nms does not exist" --
          # o app abre e trava na tela de licenca, porque nunca chega a escutar
          # na porta local. Foi assim que as versoes 1.0.4 e 1.0.5 sairam.
          #
          # Este passo NAO tem `if: cache-hit != true`, de proposito: um cache
          # gerado por um build defeituoso reproduziria o defeito em silencio.
          # Procurado por BUSCA e nao por caminho fixo. A primeira versao deste
          # passo apontava direto para `...\win32\_internal\torchvision` e
          # falhou num build correto: o COLLECT do PyInstaller cria um nivel a
          # mais (`win32\eterzion-studio-api\_internal\...`). Uma guarda que
          # reprova build bom por detalhe de layout gasta a confianca que ela
          # deveria construir.
          $raiz = "$env:GITHUB_WORKSPACE\interface\resources\backend\win32"
          if (-not (Test-Path $raiz)) {
            throw "backend nao foi empacotado: $raiz nao existe."
          }
          $dirs = Get-ChildItem $raiz -Recurse -Directory -Filter torchvision -ErrorAction SilentlyContinue
          if (-not $dirs) {
            throw "torchvision nao esta no bundle. Procurado sob $raiz."
          }
          $nativos = $dirs | ForEach-Object { Get-ChildItem $_.FullName -Filter *.pyd -ErrorAction SilentlyContinue }
          if (-not $nativos) {
            $dirs | ForEach-Object { Write-Output ("conteudo de " + $_.FullName); Get-ChildItem $_.FullName | Select-Object -First 20 Name | Out-String | Write-Output }
            throw "torchvision foi empacotado SEM extensao nativa (.pyd). O backend nao vai iniciar -- o app trava na tela de licenca. O spec usa collect_dynamic_libs para sobreviver a renames; verifique se o pacote mudou de layout."
          }
          Write-Output ("Extensao nativa presente: " + (($nativos | ForEach-Object { $_.Name }) -join ', '))

      - name: Self-check the packaged backend (native parts really load)
        shell: pwsh
        run: |
          # As guardas por arquivo acima pegam so' o defeito que ja' aconteceu.
          # Esta roda o PROPRIO executavel congelado e exercita cada parte
          # nativa (app/self_check.py): torchvision.ops, scipy.signal,
          # onnxruntime, audiosronnx, opencv, soundfile. Foi o que faltou para
          # pegar o `scipy._cyutility` ausente da 1.1.2 -- o build ficou verde
          # e a voz so' falhou na maquina de quem processou.
          $raiz = "$env:GITHUB_WORKSPACE\interface\resources\backend\win32"
          $exe = Get-ChildItem $raiz -Recurse -File -Filter 'eterzion-studio-api.exe' | Select-Object -First 1
          if (-not $exe) { throw "executavel do backend nao encontrado sob $raiz." }
          $relatorio = Join-Path $env:RUNNER_TEMP 'self-check.json'
          Remove-Item $relatorio -ErrorAction SilentlyContinue
          $proc = Start-Process -FilePath $exe.FullName -ArgumentList '--eterzion-self-check', "`"$relatorio`"" -PassThru -Wait -WindowStyle Hidden
          if (Test-Path $relatorio) { Get-Content $relatorio -Raw | Write-Output } else { Write-Output 'o executavel nao gravou relatorio (morreu antes de rodar as verificacoes).' }
          if ($proc.ExitCode -ne 0) {
            throw "Autoteste do backend empacotado falhou (codigo $($proc.ExitCode)). Veja o relatorio acima: alguma parte nativa nao carrega dentro do executavel."
          }

      - name: Verify the backend carries onnxruntime (speech engine)
        shell: pwsh
        run: |
          # A voz roda no onnxruntime empacotado. Mesmo risco do passo acima:
          # sem a extensao nativa o build fica verde e o motor de voz so' falha
          # na maquina de quem clicou em processar. Busca, nao caminho fixo.
          $raiz = "$env:GITHUB_WORKSPACE\interface\resources\backend\win32"
          $faltando = @()
          foreach ($nome in 'onnxruntime_pybind11_state.pyd', 'onnxruntime.dll') {
            $achado = Get-ChildItem $raiz -Recurse -File -Filter $nome -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($achado) { Write-Output ("presente: " + $achado.FullName.Substring($raiz.Length)) } else { $faltando += $nome }
          }
          if ($faltando) {
            throw ("onnxruntime empacotado sem: " + ($faltando -join ', ') + ". O motor de voz nao vai carregar. Veja collect_dynamic_libs('onnxruntime') no .spec.")
          }

      - name: Verify signature
        if: steps.signing.outputs.signed == 'true'
        working-directory: interface
        shell: pwsh
        run: |
          # Verificar em vez de assumir. Um certificado vencido, revogado ou com
          # a senha trocada produz um build verde e um instalador sem
          # assinatura; a única forma de saber é perguntar ao Windows depois do
          # fato.
          $exe = Get-ChildItem dist\*-setup.exe | Select-Object -First 1
          $sig = Get-AuthenticodeSignature $exe.FullName
          Write-Output "Instalador: $($exe.Name)"
          Write-Output "Assinatura: $($sig.Status)"
          if ($sig.SignerCertificate) {
            Write-Output "Assinado por: $($sig.SignerCertificate.Subject)"
            Write-Output "Valido ate:   $($sig.SignerCertificate.NotAfter)"
          }
          if ($sig.Status -ne 'Valid') {
            throw "O instalador saiu com assinatura '$($sig.Status)'. Nao sera publicado."
          }

      - name: Confirm the unsigned installer exists
        if: steps.signing.outputs.signed != 'true'
        working-directory: interface
        shell: pwsh
        run: |
          # Sem assinatura para verificar, ainda e' preciso confirmar que o
          # build produziu o instalador: publicar uma release vazia seria pior
          # que publicar uma sem assinatura. O nome traz NAO-ASSINADO porque o
          # `build:win:unsigned` renomeia o artefato.
          $exe = Get-ChildItem dist\*-setup-NAO-ASSINADO.exe | Select-Object -First 1
          if (-not $exe) { throw 'O build nao produziu instalador.' }
          Write-Output "Instalador: $($exe.Name)"
          Write-Output '::warning title=Instalador sem assinatura::Publicado sem assinatura digital.'

      - name: Confirm the update metadata exists
        working-directory: interface
        shell: pwsh
        run: |
          # O app roda `electron-updater` com `autoDownload` ligado, e o
          # updater comeca lendo o `latest.yml` da release. Sem esse arquivo
          # publicado, `checkForUpdates()` falha em toda abertura -- e falha em
          # silencio, porque o handler de erro so faz `console.warn` para nao
          # incomodar quem esta sem internet. O resultado e' uma frota inteira
          # parada numa versao antiga sem ninguem perceber.
          #
          # O `--publish never` nao impede a geracao: no app-builder-lib o
          # `createUpdateInfoTasks` fica fora do `if (isPublish)`. O que faltava
          # era o arquivo entrar na lista que a publicacao, no fim do job,
          # anexa a' release.
          if (-not (Test-Path dist\latest.yml)) {
            throw 'O build nao gerou dist/latest.yml; a atualizacao automatica ficaria quebrada.'
          }
          Get-Content dist\latest.yml

      # Publica daqui mesmo, da maquina que construiu o instalador. Ate'
      # 2026-09-12 o instalador subia como artefato para um segundo job, que o
      # baixava de volta so' para anexar a' release: ~340 MB guardados no
      # GitHub por build, sem ninguem precisar deles depois. Quinze desses
      # (5,9 GB) esgotaram a cota de artefatos da organizacao e derrubaram todo
      # `upload-artifact` da eterzion. Anexo de release nao entra nessa cota.
      #
      # Em pwsh, como o resto do job, e nao em bash: neste runner o `bash.exe`
      # que o PATH encontra e' o C:\WINDOWS\system32\bash.exe -- o
      # inicializador do WSL, nao o Git Bash. Um passo `shell: bash` rodaria
      # dentro do Linux do WSL, como LocalSystem.
      #
      # A guarda de ref importa porque a release usa `--target $GITHUB_SHA`:
      # sem ela, um `workflow_dispatch` numa branch qualquer publicaria uma
      # release apontando para o commit daquela branch, com a tag da versao do
      # `package.json`. O build continua rodando em branch -- e' assim que se
      # testa a esteira sem publicar nada.
      # O app instalado se atualiza pelo CDN privado do Studio: bucket
      # `eterzion-studio` no R2, atras do Worker de cdn.eterzion.com/studio/, que
      # so' serve com a assinatura que o servidor de licencas emite (licenca
      # ativa). Vem ANTES das releases do GitHub: a release privada, a ultima,
      # e' o sinal de que a publicacao terminou (ver `prepare`).
      - name: Upload to the Studio CDN (R2)
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          # Token do R2 com Object Read & Write SO' no bucket eterzion-studio --
          # nunca o do catalogo (eterzion-assets).
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          # rclone oficial, hash conferido antes de executar. >= 1.75: o 1.60 do
          # apt falha todo upload no R2 com NotImplemented (ver eterzion_assets/
          # cdn/README.md).
          RCLONE_VERSION: v1.75.1
          RCLONE_SHA256: 200eb602c126d82aa38b51e0f6b9ae837473ff99b51278d3f6f837574c494d6e
          # Versoes do instalador mantidas no bucket. Cada uma tem ~360 MB, e o
          # plano gratuito do R2 tem 10 GB para a conta inteira.
          MANTER_VERSOES: '3'
        run: |
          $ErrorActionPreference = 'Stop'
          function Assert-Exit([string]$oQue) {
            if ($LASTEXITCODE -ne 0) { throw "$oQue falhou (codigo $LASTEXITCODE)." }
          }
          foreach ($nome in 'R2_ACCOUNT_ID', 'R2_ACCESS_KEY_ID', 'R2_SECRET_ACCESS_KEY') {
            if (-not [Environment]::GetEnvironmentVariable($nome)) {
              throw "Segredo $nome ausente: sem ele a versao nao chega ao CDN, de onde o app se atualiza."
            }
          }

          $zip = Join-Path $env:RUNNER_TEMP "rclone-$env:RCLONE_VERSION.zip"
          Invoke-WebRequest "https://downloads.rclone.org/$env:RCLONE_VERSION/rclone-$env:RCLONE_VERSION-windows-amd64.zip" -OutFile $zip -UseBasicParsing
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:RCLONE_SHA256) { throw "rclone baixado com SHA-256 inesperado ($hash); nao sera executado." }
          $pasta = Join-Path $env:RUNNER_TEMP "rclone-$env:RCLONE_VERSION"
          Expand-Archive $zip -DestinationPath $pasta -Force
          $rclone = (Get-ChildItem $pasta -Recurse -Filter rclone.exe | Select-Object -First 1).FullName
          & $rclone version | Select-Object -First 1

          # Remote so' por variavel de ambiente: nenhuma credencial vai para
          # arquivo no disco do runner. NO_CHECK_BUCKET porque o token, restrito
          # ao bucket, nao pode (nem precisa) listar ou criar buckets.
          $env:RCLONE_CONFIG_R2_TYPE = 's3'
          $env:RCLONE_CONFIG_R2_PROVIDER = 'Cloudflare'
          $env:RCLONE_CONFIG_R2_ACCESS_KEY_ID = $env:R2_ACCESS_KEY_ID
          $env:RCLONE_CONFIG_R2_SECRET_ACCESS_KEY = $env:R2_SECRET_ACCESS_KEY
          $env:RCLONE_CONFIG_R2_ENDPOINT = "https://$env:R2_ACCOUNT_ID.r2.cloudflarestorage.com"
          $env:RCLONE_CONFIG_R2_NO_CHECK_BUCKET = 'true'
          $destino = 'r2:eterzion-studio/updates'

          $instalador = Get-ChildItem interface\dist\*-setup*.exe | Select-Object -First 1
          if (-not $instalador) { throw 'Nenhum instalador em interface\dist.' }
          $blockmap = "$($instalador.FullName).blockmap"

          # Instalador e blockmap ANTES do latest.yml: um app que leia o
          # latest.yml novo precisa encontrar no bucket o instalador que ele cita.
          foreach ($arquivo in @($instalador.FullName, $blockmap)) {
            & $rclone copyto $arquivo "$destino/$(Split-Path $arquivo -Leaf)" --retries 3
            Assert-Exit "upload de $(Split-Path $arquivo -Leaf)"
          }
          & $rclone copyto interface\dist\latest.yml "$destino/latest.yml" --retries 3
          Assert-Exit 'upload do latest.yml'

          # Retencao: as N versoes mais novas ficam; as outras saem, instalador
          # e blockmap juntos.
          $nomes = & $rclone lsf $destino --files-only
          Assert-Exit 'listagem do bucket'
          $versoes = $nomes | ForEach-Object { if ($_ -match '-(\d+\.\d+\.\d+)-setup') { [version]$Matches[1] } } |
            Sort-Object -Unique -Descending
          $manter = @($versoes | Select-Object -First ([int]$env:MANTER_VERSOES))
          foreach ($nome in $nomes) {
            if ($nome -match '-(\d+\.\d+\.\d+)-setup' -and ([version]$Matches[1] -notin $manter)) {
              & $rclone deletefile "$destino/$nome"
              Assert-Exit "remocao de $nome"
              Write-Output "removido pela retencao: $nome"
            }
          }
          Write-Output '--- no CDN agora ---'
          & $rclone lsl $destino
          Assert-Exit 'conferencia do bucket'

      - name: Publish immutable release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          # O token padrao do workflow so' escreve neste repositorio. Para o
          # de distribuicao: fine-grained token com Contents: read and write so'
          # em eterzion/eterzion_studio_releases.
          RELEASES_REPO_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
          PUBLIC_REPO: eterzion/eterzion_studio_releases
          TAG: ${{ needs.prepare.outputs.tag }}
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          $ErrorActionPreference = 'Stop'
          # Sem isto o pwsh decodifica a saida do git na pagina de codigo do
          # console, e todo acento dos titulos de commit chega errado ao
          # changelog de uma release que depois nao pode ser editada.
          [Console]::OutputEncoding = [Text.UTF8Encoding]::new($false)

          # Comando nativo nao lanca excecao ao falhar; o codigo de saida tem
          # que ser conferido a cada chamada que importa.
          function Assert-Exit([string]$oQue) {
            if ($LASTEXITCODE -ne 0) { throw "$oQue falhou (codigo $LASTEXITCODE)." }
          }

          # Sem o token, falhar AQUI, antes de publicar qualquer coisa: uma
          # release so' no privado e' justamente o estado que nao chega a
          # ninguem (e o `prepare` passaria a pular o build dessa versao).
          if (-not $env:RELEASES_REPO_TOKEN) {
            throw "Segredo RELEASES_REPO_TOKEN ausente: sem ele a release nao chega ao repositorio publico ($env:PUBLIC_REPO), de onde o app instalado se atualiza."
          }

          gh release view $env:TAG --repo $env:GITHUB_REPOSITORY *> $null
          $privadaExiste = $LASTEXITCODE -eq 0
          $env:GH_TOKEN_PUB = $env:RELEASES_REPO_TOKEN

          $version = $env:TAG -replace '^v', ''

          # Mesmo corpo dos demais repositorios da Eterzion (ver
          # eterzion_multicharacter/.github/workflows/release.yml): quem
          # acompanha varios resources le sempre a mesma estrutura.
          #
          # As tags precisam estar no repositorio local para delimitar o
          # intervalo. Num runner auto-hospedado (workspace persistente) ja'
          # aconteceu de nenhuma tag chegar mesmo com `fetch-tags: true`: foi
          # assim que a v1.0.3 saiu com 319 bullets, o historico inteiro, em vez
          # dos tres commits desde a v1.0.2. O checkout deste job mantem a
          # credencial, entao este fetch autentica sem mais nada.
          git fetch --tags --force --quiet origin
          Assert-Exit 'git fetch das tags'

          $previousTag = git tag --sort=-version:refname |
            Where-Object { $_ -ne $env:TAG } |
            Select-Object -First 1

          # Uma release anterior que existe no GitHub mas nao tem tag local
          # significa ambiente quebrado, e o changelog sairia com o repositorio
          # inteiro -- notas erradas numa release imutavel. Parar e' melhor.
          $latestRelease = gh release list --repo $env:GITHUB_REPOSITORY --limit 1 --json tagName --jq '.[0].tagName // empty'
          Assert-Exit 'gh release list'
          if (-not $previousTag -and $latestRelease) {
            Write-Output "::error::A release $latestRelease existe, mas nenhuma tag local foi encontrada; o changelog sairia com o historico inteiro."
            exit 1
          }

          $range = if ($previousTag) { "$previousTag..HEAD" } else { 'HEAD' }
          $changes = (git log $range --pretty=format:"- %s [%h](https://github.com/$env:GITHUB_REPOSITORY/commit/%H)") -join "`n"
          Assert-Exit 'git log'
          if (-not $changes) { $changes = '- Nenhuma alteração registrada.' }
          # No repositorio publico, sem link: os commits sao do privado e o
          # link daria 404 para quem le as notas.
          $changesPublico = (git log $range --pretty=format:"- %s") -join "`n"
          if (-not $changesPublico) { $changesPublico = '- Nenhuma alteração registrada.' }

          $linhas = @()
          # Um instalador sem assinatura nao pode chegar ao usuario parecendo
          # igual a um assinado. O aviso vai no topo das notas, onde ele le
          # antes de baixar, e nao so no log do build que ninguem abre.
          if ($env:SIGNED -ne 'true') {
            $linhas += '> **Instalador sem assinatura digital.** O Windows vai exibir o aviso do SmartScreen ("editor desconhecido") na primeira execução. Prossiga apenas se você confia na origem deste arquivo.'
            $linhas += ''
          }
          $linhas += '## Detalhes da versão'
          $linhas += ''
          $linhas += "**Versão:** $version"
          $linhas += "**Data:** $((Get-Date).ToString('dd/MM/yyyy'))"
          $linhas += ''
          $linhas += '## Changelog'
          $linhas += ''
          $linhasPublico = $linhas + @($changesPublico)
          $linhas += $changes

          # A release carrega so' o que o usuario final baixa: o instalador
          # (com ou sem assinatura no nome), o blockmap que o updater usa para
          # o download diferencial e o `latest.yml` que ele le para descobrir
          # que ha versao nova. Os passos acima ja' confirmaram que existem;
          # esta checagem so' impede uma release sem instalador se alguem
          # mexer neles.
          $arquivos = @(Get-ChildItem interface\dist\*-setup*.exe*) + @(Get-Item interface\dist\latest.yml)
          if (-not ($arquivos | Where-Object { $_.Extension -eq '.exe' })) {
            throw 'Nenhum instalador em interface\dist; a release nao sera criada.'
          }
          $arquivos | ForEach-Object { Write-Output "Anexando: $($_.Name)" }

          $notas = [IO.Path]::GetTempFileName()
          $notasPublico = [IO.Path]::GetTempFileName()
          try {
            # LF e UTF-8 sem BOM: e' o que o GitHub renderiza sem sobra.
            [IO.File]::WriteAllText($notas, ($linhas -join "`n") + "`n", [Text.UTF8Encoding]::new($false))
            [IO.File]::WriteAllText($notasPublico, ($linhasPublico -join "`n") + "`n", [Text.UTF8Encoding]::new($false))

            $extra = @()
            if ($env:TAG -match '(alpha|beta|rc)') { $extra += '--prerelease' } else { $extra += '--latest' }

            # 1) Publico primeiro: e' o que chega ao app instalado. Sem
            # `--target`: o commit e' do repositorio privado; a tag no publico
            # fica sobre o branch padrao dele, que so' tem o README.
            $antes = $env:GH_TOKEN
            $env:GH_TOKEN = $env:GH_TOKEN_PUB
            gh release view $env:TAG --repo $env:PUBLIC_REPO *> $null
            if ($LASTEXITCODE -eq 0) {
              Write-Output "Release $env:TAG ja' existe em $env:PUBLIC_REPO; nao duplica."
            } else {
              gh release create $env:TAG @($arquivos.FullName) `
                --repo $env:PUBLIC_REPO `
                --title $env:TAG `
                --notes-file $notasPublico `
                @extra
              Assert-Exit 'gh release create (publico)'
            }
            $env:GH_TOKEN = $antes

            # 2) Privado: historico, tag no commit certo e changelog com links.
            if ($privadaExiste) {
              Write-Output "Release $env:TAG was created by another run in $env:GITHUB_REPOSITORY; refusing to duplicate it."
              exit 0
            }
            gh release create $env:TAG @($arquivos.FullName) `
              --repo $env:GITHUB_REPOSITORY `
              --target $env:GITHUB_SHA `
              --title $env:TAG `
              --notes-file $notas `
              @extra
            Assert-Exit 'gh release create'
          } finally {
            Remove-Item $notas, $notasPublico -ErrorAction SilentlyContinue
          }
