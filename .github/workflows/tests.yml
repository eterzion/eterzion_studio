name: Tests

on:
  push:
    branches: [main]
  # Sem isto, nenhum PR deste repositório era testado: os testes só rodavam
  # depois, quando o código já estava na main. Um Dependabot sem esta linha é
  # passivo, não ajuda — ele abre bumps que ninguém consegue avaliar, e a quebra
  # aparece na main.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# O cache do Actions existe para runner EFEMERO, que nasce vazio. Os dois jobs
# de pytest rodam no runner auto-hospedado -- desde 04/09/2026 um desktop, nao
# mais a VPS -- e ele persiste: usar o cache do Actions ali significa subir e
# baixar ~547 MiB pela rede para uma maquina que ja tinha os arquivos em disco.
#
# Medido em 04/09/2026: 52 caches somando 9,97 GiB contra o limite de 10 GiB
# do repositorio, 7,71 GiB deles do setup-uv. Estourado, o GitHub despeja os
# mais antigos para caber -- inclusive o que a proxima execucao procuraria.
# O passo do setup-uv gastava 76s baixando tudo de novo, quase sempre.
#
# UV_CACHE_DIR aponta para disco local do runner. Fora dele (o job do desktop
# roda em runner da GitHub) a variavel e' inofensiva: o uv nem participa.
# Ligar o gatilho de pull_request colocou dez PRs abertos na fila de uma vez, e
# dois dos tres jobs rodam num unico runner auto-hospedado — eles nao paralelizam,
# enfileiram. Sem isto, cada push novo num PR soma uma corrida em vez de
# substituir a anterior, e a fila cresce mais rapido do que drena.
#
# **Cancela so o que ficou obsoleto, e so em PR.** O grupo inclui a ref, entao
# PRs diferentes nunca cancelam um ao outro; e `cancel-in-progress` fica falso
# fora de pull_request, porque uma corrida da main validando o que ja foi
# integrado nao deve ser interrompida por causa do commit seguinte — e dela que
# sai o sinal de que a main esta sa.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A esteira de release construia o sdist/wheel de `api/` para anexar na
  # release. Os arquivos sairam de la porque ninguem os consumia, mas o build
  # em si continua valendo: e' o unico lugar que prova que o `pyproject.toml`
  # esta consistente. Aqui ele vale mais do que valia, porque roda em cada PR
  # em vez de so depois do merge, quando quebrar ja teria travado a publicacao.
  python-package-build:
    name: Python package (build)
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["ubuntu-24.04"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check build
      - run: python -m build api

  licensing-service-tests:
    name: Licensing service (pytest)
    # Os dois jobs de pytest rodam em runner **auto-hospedado**, e um runner
    # desses executa o que o PR mandar na máquina de quem o hospeda. Para PR do
    # próprio repositório isso é aceitável — quem abriu já tem acesso de escrita.
    # De um fork, não é: seria dar a máquina a qualquer pessoa que abrir um PR.
    # O job do desktop app carrega a mesma guarda desde que passou a poder cair
    # no runner auto-hospedado também.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["ubuntu-24.04"]') }}
    defaults:
      run:
        working-directory: api/eterzion_licensing_service
    steps:
      - uses: actions/checkout@v7
      # Cache do uv no disco do runner persistente, em vez do cache do
      # Actions. Escrito por um passo, e nao por `env:`, porque o contexto
      # `runner` so existe em step -- em `env` de workflow ou de job o
      # GitHub recusa o arquivo inteiro, e a run aparece sem nenhum job.
      - run: printf 'UV_CACHE_DIR=%s\n' "${RUNNER_TOOL_CACHE}/uv-cache" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      # Versao fixa: sem ela o setup-uv resolve "a mais recente" pela rede a
      # cada execucao, o que alem de lento derrubou esta CI em 04/09/2026 com
      # "Manifest fetch failed". Fixada, ele acha no tool cache do runner
      # persistente e nao toca na rede.
      #
      # enable-cache desligado de proposito: o cache do Actions e' para runner
      # EFEMERO. Este roda na VPS, que persiste -- cachear ali era subir e
      # baixar ~547 MiB para uma maquina que ja tinha os arquivos. O cache do
      # uv vive em UV_CACHE_DIR, escrito pelo passo logo apos o checkout.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: '0.12.9'
          enable-cache: false
      - name: Create isolated Python environment
        run: |
          ci_venv="${RUNNER_TEMP}/eterzion-studio-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-licensing"
          printf 'CI_VENV=%s\n' "$ci_venv" >> "$GITHUB_ENV"
          uv venv --clear "$ci_venv" --python python
      - run: uv pip install --python "$CI_VENV/bin/python" -r requirements-dev.txt
      - run: >-
          "$CI_VENV/bin/python" -m pytest --cov-report=xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: licensing-service-coverage
          path: api/eterzion_licensing_service/coverage.xml

  upscale-api-tests:
    name: Upscale API (pytest)
    # Os dois jobs de pytest rodam em runner **auto-hospedado**, e um runner
    # desses executa o que o PR mandar na máquina de quem o hospeda. Para PR do
    # próprio repositório isso é aceitável — quem abriu já tem acesso de escrita.
    # De um fork, não é: seria dar a máquina a qualquer pessoa que abrir um PR.
    # O job do desktop app carrega a mesma guarda desde que passou a poder cair
    # no runner auto-hospedado também.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    # setup-python's toolcache persists between jobs on this self-hosted runner.
    # A unique venv prevents dependencies from another run or former repository
    # name from contaminating the tested PyTorch stack.
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["ubuntu-24.04"]') }}
    defaults:
      run:
        working-directory: api/eterzion_upscale_api
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            api
            models
            # fetch-ffmpeg.mjs only — it imports nothing but node builtins, so
            # the rest of interface/ stays out of this checkout.
            interface/scripts
            # test_status_enum_is_single_source.py le o api.ts do renderer para
            # comparar o enum de status dos dois lados. Sem este caminho o teste
            # falha em FileNotFoundError, que parece bug de teste e e' recorte
            # do checkout.
            interface/src/renderer/src/services
            # test_no_control_without_implementation.py (T094/FR-068) cruza o
            # que os controles da Central emitem com o que as dataclasses
            # aceitam. Sem este caminho ele nao falha: SKIPA, porque o proprio
            # teste tem `skipif(not COMPONENTES.is_dir())`. Cinco testes de
            # guarda ficavam verdes sem nunca rodar -- pior que o
            # FileNotFoundError acima, que ao menos aparecia.
            interface/src/renderer/src/components/compression
          sparse-checkout-cone-mode: true
      # Cache do uv no disco do runner persistente, em vez do cache do
      # Actions. Escrito por um passo, e nao por `env:`, porque o contexto
      # `runner` so existe em step -- em `env` de workflow ou de job o
      # GitHub recusa o arquivo inteiro, e a run aparece sem nenhum job.
      - run: printf 'UV_CACHE_DIR=%s\n' "${RUNNER_TOOL_CACHE}/uv-cache" >> "$GITHUB_ENV"
      # Test against the binary the USER receives, not against whatever ffmpeg
      # the runner happens to provide.
      #
      # This used to be `setup-ffmpeg`, which installs a GPL build on PATH.
      # Development therefore exercised a different FFmpeg from the shipped one,
      # and three separate defects lived in that gap without a single red test:
      # a GPL encoder default, two GPL filters (`eq`, `hqdn3d`) that do not exist
      # in an LGPL build at all, and an ffprobe the bundle did not carry. Each
      # worked perfectly in CI and would have failed on a user's machine.
      #
      # fetch-ffmpeg.mjs downloads the same pinned LGPL build electron-builder
      # packages; ASTROS_FFMPEG_DIR is the same variable the Electron main
      # process sets at runtime, so the resolution path under test is the real
      # one. No `setup-ffmpeg`: putting a GPL build on PATH would let a fallback
      # hide exactly what this is here to catch.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      # Alvo linux, nao win32: este job roda no runner Linux self-hosted. O
      # build LGPL e o mesmo conjunto de codecs em qualquer plataforma, que e
      # o que estes testes verificam -- e o .zip do Windows nem extrai aqui,
      # porque o tar do Linux e GNU tar e nao le zip.
      - run: node interface/scripts/fetch-ffmpeg.mjs linux
        working-directory: ${{ github.workspace }}
      # LD_LIBRARY_PATH e necessario: o RPATH gravado no binario do BtbN e
      # literalmente "-Wl:../lib" -- a flag do linker vazou para dentro do
      # campo em vez de $ORIGIN. Confirmado com readelf -d. Sem isto o
      # ffmpeg nao carrega libavdevice.so.62 nem estando ao lado dela.
      - run: echo "ASTROS_FFMPEG_DIR=${{ github.workspace }}/interface/resources/ffmpeg/linux" >> "$GITHUB_ENV"
        working-directory: ${{ github.workspace }}
      - run: echo "LD_LIBRARY_PATH=${{ github.workspace }}/interface/resources/ffmpeg/linux" >> "$GITHUB_ENV"
        working-directory: ${{ github.workspace }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      # Versao fixa e cache em disco local: ver o comentario no job de
      # licensing acima.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: '0.12.9'
          enable-cache: false
      # CI runners have no GPU — the CUDA torch/torchaudio wheels pulled by
      # requirements.txt's unpinned `torch`/`torchaudio` are several GB and
      # dominate the job's runtime. Installing the CPU wheels first satisfies
      # those (unversioned) requirement lines, so the requirements-dev.txt
      # install below reuses them instead of re-resolving CUDA builds.
      #
      # torchvision precisa vir DESTA linha, do mesmo indice, embora nao esteja
      # em requirements.txt: ele entra como dependencia do spandrel e, vindo do
      # PyPI padrao, e' um build compilado contra outro torch. Os dois carregam
      # sem erro e a falha aparece so no primeiro uso, como
      # "RuntimeError: operator torchvision::nms does not exist".
      #
      # O --reinstall que ficava aqui existia porque o `--system` escrevia no
      # tool cache do setup-python, compartilhado entre execucoes: sem a flag,
      # o uv via o requisito ja satisfeito por uma versao incompativel deixada
      # por um job anterior. A flag tratava o sintoma e custava ~19s por
      # execucao reinstalando o que quase sempre ja estava certo.
      #
      # A causa era o `--system`. Um venv proprio por execucao -- o mesmo
      # padrao que o job do licensing acima ja usa -- nao tem o que herdar,
      # entao nao precisa reinstalar nada. O cache do uv em UV_CACHE_DIR vive
      # no disco do runner, e as wheels vem de la sem rede.
      - name: Create isolated Python environment
        run: |
          ci_venv="${RUNNER_TEMP}/eterzion-studio-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-upscale"
          printf 'CI_VENV=%s\n' "$ci_venv" >> "$GITHUB_ENV"
          uv venv --clear "$ci_venv" --python python
      - run: uv pip install --python "$CI_VENV/bin/python" torch torchaudio torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: uv pip install --python "$CI_VENV/bin/python" -r requirements-dev.txt
      # eterzion_upscale is a real dependency of app.processing/app.routes —
      # installed editable from its new home in api/ instead of the sys.path
      # climbing conftest.py used to do (see
      # specs/002-api-interface-split/research.md Decisão 3).
      - run: uv pip install --python "$CI_VENV/bin/python" --no-deps -e ..
      # Deselect `slow` (real subprocess/model-inference) tests from the
      # required CI run — they run real ffmpeg/model workloads unsuited to a
      # tight time budget. Run them locally or in a separate scheduled job
      # before release. `-n auto` (pytest-xdist) spreads the rest across the
      # runner's cores instead of running ~30 test files serially.
      # Build the video fixtures before the suite instead of letting 52 tests
      # skip themselves. They were skipping everywhere, CI included, because the
      # generator encoded with libx264 — GPL, and absent from any LGPL ffmpeg —
      # so it failed and nobody noticed: a skipped test reports success. It uses
      # mpeg4 now and runs anywhere. ~15 s for the whole export path under test.
      - run: >-
          "$CI_VENV/bin/python" tests/fixtures/make_video_fixtures.py
      # Deselect `slow` (real subprocess/model-inference) tests from the
      # required CI run — they run real ffmpeg/model workloads unsuited to a
      # tight time budget. Run them locally or in a separate scheduled job
      # before release. `-n auto` (pytest-xdist) spreads the rest across the
      # runner's cores instead of running ~30 test files serially.
      #
      # Os testes com fixture chamam ffmpeg por subprocesso e varios afirmam
      # sobre duracao medida, entao o numero de workers e' limitado pela carga
      # que a maquina aguenta, nao pelo numero de CPUs.
      #
      # Ate 04/09/2026 o runner auto-hospedado era a VPS de 2 vCPU, onde
      # `-n auto` resolvia para 2 -- e foi com 2 que esta suite passou a ser
      # validada. No desktop de 32 threads, `-n auto` abre 32 e `-n 4` ainda
      # deixa a suite instavel: 865 testes passam e um diferente falha a cada
      # execucao, sempre um dos sensiveis a tempo ou a subprocesso.
      #
      # Fixado em 2, que e' a concorrencia sob a qual a suite foi validada.
      # Isso e' mitigacao, nao cura: os testes sensiveis a carga continuam
      # sensiveis, e valeria endurece-los antes de subir esse numero.
      - run: >-
          "$CI_VENV/bin/python" -m pytest -m "not slow" -n 2 --durations=20 --cov-report=xml
      # The core library has its own suite (api/eterzion_upscale/tests, 81 tests)
      # and the step above never reached it: pytest.ini here sets
      # `testpaths = tests`, which is this package's tests and nothing else. It
      # needs its own step run from api/, whose pyproject.toml points pytest at
      # the other directory. Without this, the encoder/licensing guards in
      # test_optimize.py only ever ran on a developer machine.
      - run: >-
          "$CI_VENV/bin/python" -m pytest -p no:cacheprovider
        working-directory: api
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: upscale-api-coverage
          path: api/eterzion_upscale_api/coverage.xml

  frontend-lint-and-typecheck:
    name: Desktop app — lint, typecheck + tests
    # Este job passou a poder cair no runner auto-hospedado, entao herda a mesma
    # guarda dos dois de pytest: um runner desses executa o que o PR mandar na
    # maquina de quem o hospeda, e de um fork isso seria dar a maquina a
    # qualquer pessoa que abrir um PR.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["ubuntu-24.04"]') }}
    defaults:
      run:
        working-directory: interface
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.0.10
        with:
          version: 11
          dest: ${{ runner.temp }}/pnpm-upscale-${{ github.run_id }}-${{ github.job }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: interface/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      # The renderer suite (vitest.config.ts, added by 007-video-editor-player)
      # ran only on developer machines until here — including the locale-parity
      # test, which is the only automated guard that the 11 translation files
      # stay in step. `vitest run` needs no display and no Electron binary: the
      # config points at renderer sources under happy-dom, so it belongs in this
      # same ubuntu job rather than a runner of its own.
      - run: pnpm run test
