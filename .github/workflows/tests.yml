name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  licensing-service-tests:
    name: Licensing service (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: interface/astros_licensing_service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: interface/astros_licensing_service/requirements*.txt
      - run: uv pip install --system -r requirements-dev.txt
      - run: pytest --cov-report=xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: licensing-service-coverage
          path: interface/astros_licensing_service/coverage.xml

  upscale-api-tests:
    name: Upscale API (pytest)
    runs-on: windows-latest
    # DPAPI (used by app.core.dpapi / install_identity.py) is Windows-only —
    # the same reason install_identity.py itself falls back to a weaker,
    # explicitly-documented no-op on other platforms. Running this suite on
    # windows-latest exercises the real code path instead of the fallback.
    defaults:
      run:
        working-directory: interface/astros_upscale_api
    steps:
      # The repo carries ~130MB of model checkpoints under /models and
      # /inputs (real fixtures for the `slow` model-inference tests, which
      # this job deselects) — on a Windows runner, writing that to disk on
      # every checkout was a meaningful chunk of this job's time. Only
      # astros_upscale/ (imported via sys.path by conftest.py) and this
      # job's own working directory are needed for the "not slow" suite.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            astros_upscale
            interface/astros_upscale_api
          sparse-checkout-cone-mode: true
      # windows-latest ships no ffmpeg on PATH. Several non-`slow` tests
      # (e.g. test_content_type_audio.py) shell out to a real `ffmpeg` to
      # synthesize fixture audio/video, so without this they fail with
      # WinError 2 rather than being skipped.
      - uses: FedericoCarboni/setup-ffmpeg@v3
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      # uv resolves/downloads/installs in parallel with a Rust binary — no
      # per-call pip resolver overhead — and its cache survives across runs,
      # which is what actually keeps this job under budget on a Windows
      # runner (slower disk/process spawn than Linux runners).
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: interface/astros_upscale_api/requirements*.txt
      # CI runners have no GPU — the CUDA torch/torchaudio wheels pulled by
      # requirements.txt's unpinned `torch`/`torchaudio` are several GB and
      # dominate the job's runtime. Installing the CPU wheels first satisfies
      # those (unversioned) requirement lines, so the requirements-dev.txt
      # install below reuses them instead of re-resolving CUDA builds.
      - run: uv pip install --system torch torchaudio --index-url https://download.pytorch.org/whl/cpu
      - run: uv pip install --system -r requirements-dev.txt
      # Deselect `slow` (real subprocess/model-inference) tests from the
      # required CI run — they run real ffmpeg/model workloads unsuited to a
      # tight time budget. Run them locally or in a separate scheduled job
      # before release. `-n auto` (pytest-xdist) spreads the rest across the
      # runner's cores instead of running ~30 test files serially.
      - run: pytest -m "not slow" -n auto --durations=20 --cov-report=xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: upscale-api-coverage
          path: interface/astros_upscale_api/coverage.xml

  frontend-lint-and-typecheck:
    name: Desktop app — lint + typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: interface/astros_upscale_app
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: interface/astros_upscale_app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
