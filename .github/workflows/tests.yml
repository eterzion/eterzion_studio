name: Tests

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  licensing-service-tests:
    name: Licensing service (pytest)
    runs-on: [self-hosted, linux, x64, hostinger]
    defaults:
      run:
        working-directory: api/astros_licensing_service
    env:
      CI_VENV: ${{ runner.temp }}/eterzion-studio-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v10.0.0
        with:
          enable-cache: true
          cache-dependency-glob: api/astros_licensing_service/requirements*.txt
      - name: Create isolated Python environment
        run: uv venv --clear "$CI_VENV" --python python
      - run: uv pip install --python "$CI_VENV/bin/python" -r requirements-dev.txt
      - run: "$CI_VENV/bin/python" -m pytest --cov-report=xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: licensing-service-coverage
          path: api/astros_licensing_service/coverage.xml

  upscale-api-tests:
    name: Upscale API (pytest)
    # setup-python's toolcache persists between jobs on this self-hosted runner.
    # A unique venv prevents dependencies from another run or former repository
    # name from contaminating the tested PyTorch stack.
    runs-on: [self-hosted, linux, x64, hostinger]
    defaults:
      run:
        working-directory: api/astros_upscale_api
    env:
      CI_VENV: ${{ runner.temp }}/eterzion-studio-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            api
            models
          sparse-checkout-cone-mode: true
      - uses: FedericoCarboni/setup-ffmpeg@v3.1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v10.0.0
        with:
          enable-cache: true
          cache-dependency-glob: api/astros_upscale_api/requirements*.txt
      - name: Create isolated Python environment
        run: uv venv --clear "$CI_VENV" --python python
      - name: Install the CPU PyTorch stack
        run: >-
          uv pip install --python "$CI_VENV/bin/python"
          torch torchvision torchaudio
          --index-url https://download.pytorch.org/whl/cpu
      - run: uv pip install --python "$CI_VENV/bin/python" -r requirements-dev.txt
      - run: uv pip install --python "$CI_VENV/bin/python" --no-deps -e ..
      - name: Verify the CPU PyTorch stack
        run: |
          "$CI_VENV/bin/python" - <<'PY'
          import torch
          import torchvision
          import torchaudio

          print(f"torch={torch.__version__}")
          print(f"torchvision={torchvision.__version__}")
          print(f"torchaudio={torchaudio.__version__}")
          if torch.version.cuda is not None:
              raise SystemExit(f"Expected CPU-only torch, found CUDA {torch.version.cuda}")
          PY
      - run: "$CI_VENV/bin/python" -m pytest -m "not slow" -n auto --durations=20 --cov-report=xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: upscale-api-coverage
          path: api/astros_upscale_api/coverage.xml

  frontend-lint-and-typecheck:
    name: Desktop app — lint + typecheck
    runs-on: [self-hosted, linux, x64, hostinger]
    defaults:
      run:
        working-directory: interface
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.0.10
        with:
          version: 11
          dest: ${{ runner.temp }}/pnpm-upscale-${{ github.run_id }}-${{ github.job }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: interface/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
