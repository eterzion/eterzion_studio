name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  licensing-service-tests:
    name: Licensing service (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api/astros_licensing_service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v10.0.0
        with:
          enable-cache: true
          cache-dependency-glob: api/astros_licensing_service/requirements*.txt
      - run: uv pip install --system -r requirements-dev.txt
      - run: pytest --cov-report=xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: licensing-service-coverage
          path: api/astros_licensing_service/coverage.xml

  upscale-api-tests:
    name: Upscale API (pytest)
    runs-on: windows-latest
    # DPAPI (used by app.security) is Windows-only — the same reason
    # app.security's install identity itself falls back to a weaker,
    # explicitly-documented no-op on other platforms. Running this suite on
    # windows-latest exercises the real code path instead of the fallback.
    defaults:
      run:
        working-directory: api/astros_upscale_api
    steps:
      # /inputs at repo root (~2.3MB) is unused by any test, slow or not —
      # confirmed via grep. /models IS needed even by non-`slow` tests
      # (test_component_manager.py checks real on-disk install state), so
      # it stays. api/ as a whole (astros_upscale + astros_upscale_api +
      # astros_licensing_service + pyproject.toml) is checked out together —
      # astros_upscale must be pip-installable from api/pyproject.toml, and
      # sparse-checkout's cone mode only grants directory-level granularity,
      # so there's no cheaper way to include just pyproject.toml + the two
      # subpackages this job actually needs. This still skips the frontend
      # tree, docs/specs, and other unrelated top-level dirs on this Windows
      # runner.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            api
            models
            # fetch-ffmpeg.mjs only — it imports nothing but node builtins, so
            # the rest of interface/ stays out of this Windows checkout.
            interface/scripts
          sparse-checkout-cone-mode: true
      # Test against the binary the USER receives, not against whatever ffmpeg
      # the runner happens to provide.
      #
      # This used to be `setup-ffmpeg`, which installs a GPL build on PATH.
      # Development therefore exercised a different FFmpeg from the shipped one,
      # and three separate defects lived in that gap without a single red test:
      # a GPL encoder default, two GPL filters (`eq`, `hqdn3d`) that do not exist
      # in an LGPL build at all, and an ffprobe the bundle did not carry. Each
      # worked perfectly in CI and would have failed on a user's machine.
      #
      # fetch-ffmpeg.mjs downloads the same pinned LGPL build electron-builder
      # packages; ASTROS_FFMPEG_DIR is the same variable the Electron main
      # process sets at runtime, so the resolution path under test is the real
      # one. No `setup-ffmpeg`: putting a GPL build on PATH would let a fallback
      # hide exactly what this is here to catch.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: node interface/scripts/fetch-ffmpeg.mjs win32
        working-directory: ${{ github.workspace }}
      - run: echo "ASTROS_FFMPEG_DIR=${{ github.workspace }}\interface\resources\ffmpeg\win32" >> $env:GITHUB_ENV
        working-directory: ${{ github.workspace }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      # uv resolves/downloads/installs in parallel with a Rust binary — no
      # per-call pip resolver overhead — and its cache survives across runs,
      # which is what actually keeps this job under budget on a Windows
      # runner (slower disk/process spawn than Linux runners).
      - uses: astral-sh/setup-uv@v10.0.0
        with:
          enable-cache: true
          cache-dependency-glob: api/astros_upscale_api/requirements*.txt
      # CI runners have no GPU — the CUDA torch/torchaudio wheels pulled by
      # requirements.txt's unpinned `torch`/`torchaudio` are several GB and
      # dominate the job's runtime. Installing the CPU wheels first satisfies
      # those (unversioned) requirement lines, so the requirements-dev.txt
      # install below reuses them instead of re-resolving CUDA builds.
      - run: uv pip install --system torch torchaudio --index-url https://download.pytorch.org/whl/cpu
      - run: uv pip install --system -r requirements-dev.txt
      # astros_upscale is a real dependency of app.processing/app.routes —
      # installed editable from its new home in api/ instead of the sys.path
      # climbing conftest.py used to do (see
      # specs/002-api-interface-split/research.md Decisão 3).
      - run: uv pip install --system --no-deps -e ..
      # Deselect `slow` (real subprocess/model-inference) tests from the
      # required CI run — they run real ffmpeg/model workloads unsuited to a
      # tight time budget. Run them locally or in a separate scheduled job
      # before release. `-n auto` (pytest-xdist) spreads the rest across the
      # runner's cores instead of running ~30 test files serially.
      # Build the video fixtures before the suite instead of letting 52 tests
      # skip themselves. They were skipping everywhere, CI included, because the
      # generator encoded with libx264 — GPL, and absent from any LGPL ffmpeg —
      # so it failed and nobody noticed: a skipped test reports success. It uses
      # mpeg4 now and runs anywhere. ~15 s for the whole export path under test.
      - run: python tests/fixtures/make_video_fixtures.py
      # Deselect `slow` (real subprocess/model-inference) tests from the
      # required CI run — they run real ffmpeg/model workloads unsuited to a
      # tight time budget. Run them locally or in a separate scheduled job
      # before release. `-n auto` (pytest-xdist) spreads the rest across the
      # runner's cores instead of running ~30 test files serially.
      #
      # A note for local runs: the fixture-backed tests shell out to ffmpeg, and
      # `-n auto` on a 16-core workstation starts 16 of them at once, which the
      # machine loses. That shows up as a dozen unrelated-looking failures that
      # vanish at `-n 4`. Runners have 4 cores, so `-n auto` is already `-n 4`
      # here; cap it yourself locally.
      - run: pytest -m "not slow" -n auto --durations=20 --cov-report=xml
      # The core library has its own suite (api/astros_upscale/tests, 81 tests)
      # and the step above never reached it: pytest.ini here sets
      # `testpaths = tests`, which is this package's tests and nothing else. It
      # needs its own step run from api/, whose pyproject.toml points pytest at
      # the other directory. Without this, the encoder/licensing guards in
      # test_optimize.py only ever ran on a developer machine.
      - run: pytest -p no:cacheprovider
        working-directory: api
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: upscale-api-coverage
          path: api/astros_upscale_api/coverage.xml

  frontend-lint-and-typecheck:
    name: Desktop app — lint, typecheck + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: interface
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.0.10
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: interface/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      # The renderer suite (vitest.config.ts, added by 007-video-editor-player)
      # ran only on developer machines until here — including the locale-parity
      # test, which is the only automated guard that the 11 translation files
      # stay in step. `vitest run` needs no display and no Electron binary: the
      # config points at renderer sources under happy-dom, so it belongs in this
      # same ubuntu job rather than a runner of its own.
      - run: pnpm run test
