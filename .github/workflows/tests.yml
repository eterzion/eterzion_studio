name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  licensing-service-tests:
    name: Licensing service (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: interface/astros_licensing_service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            interface/astros_licensing_service/requirements.txt
            interface/astros_licensing_service/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest --cov-report=xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: licensing-service-coverage
          path: interface/astros_licensing_service/coverage.xml

  upscale-api-tests:
    name: Upscale API (pytest)
    runs-on: windows-latest
    # DPAPI (used by app.core.dpapi / install_identity.py) is Windows-only —
    # the same reason install_identity.py itself falls back to a weaker,
    # explicitly-documented no-op on other platforms. Running this suite on
    # windows-latest exercises the real code path instead of the fallback.
    defaults:
      run:
        working-directory: interface/astros_upscale_api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            interface/astros_upscale_api/requirements.txt
            interface/astros_upscale_api/requirements-dev.txt
      # CI runners have no GPU — the CUDA torch/torchaudio wheels pulled by
      # requirements.txt's unpinned `torch`/`torchaudio` are several GB and
      # dominate the job's runtime. Installing the CPU wheels first satisfies
      # those (unversioned) requirement lines, so the requirements-dev.txt
      # install below reuses them instead of re-resolving CUDA builds.
      - run: pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements-dev.txt
      # Deselect `slow` (real subprocess/model-inference) tests from the
      # required CI run to keep it fast — they run real ffmpeg/model
      # workloads unsuited to a 3-minute budget. Run them locally or in a
      # separate scheduled job before release.
      - run: pytest -m "not slow" --cov-report=xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: upscale-api-coverage
          path: interface/astros_upscale_api/coverage.xml

  frontend-lint-and-typecheck:
    name: Desktop app — lint + typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: interface/astros_upscale_app
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: interface/astros_upscale_app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
