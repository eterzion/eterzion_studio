[pytest]
testpaths = tests
python_files = test_*.py
addopts = -ra --cov=app --cov-report=term-missing
markers =
    slow: spawns a real subprocess or runs real model inference (deselect with -m "not slow")
    hardware: depends on real GPU/VRAM detection results, varies by machine
    video: exercises the video-enhance pipeline (real ffmpeg + real frames)
    audio: exercises the audio-enhance pipeline (real ffmpeg + real audio)
