<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Dev Preview</title>
    <script>
      // Must run before any ESM import (store/history.ts reads localStorage at module
      // top-level the instant it's first imported) — a classic module-eval-order trap.
      var now = Date.now()
      var cfg = {
        mode: 'preset', presetFactor: 4, customWidth: null, customHeight: null, lockAspectRatio: true,
        model: 'realesrgan-x4', device: 'auto', denoise: 50, sharpen: 0, faceRecovery: false, faceRecoveryStrength: 50
      }
      var entries = [
        { id: '1', sourcePath: 'C:/Users/Eric Inacio/Pictures/map-black-and-white-very-long-filename-test.png', fileName: 'map-black-and-white-very-long-filename-test.png', status: 'done', createdAt: now - 60000, completedAt: now - 30000, originalWidth: 512, originalHeight: 512, newWidth: 2048, newHeight: 2048, model: 'realesrgan-x4', scale: 4, outputSizeBytes: 3400000, outputPath: 'D:/out/map_upscaled.png', scaleConfig: cfg },
        { id: '2', sourcePath: 'C:/img2.jpg', fileName: 'portrait.jpg', status: 'processing', createdAt: now - 5000, originalWidth: 1024, originalHeight: 768, model: 'nomos2-dat2', scale: 4, scaleConfig: cfg },
        { id: '3', sourcePath: 'C:/img3.jpg', fileName: 'failed-job.jpg', status: 'error', createdAt: now - 200000, completedAt: now - 190000, originalWidth: 800, originalHeight: 600, model: 'ultrasharp', scale: 4, errorMessage: 'CUDA out of memory. Tried to allocate 2.5 GB.', scaleConfig: cfg }
      ]
      for (var i = 4; i < 14; i++) {
        entries.push({
          id: String(i), sourcePath: 'C:/img' + i + '.jpg', fileName: 'batch-image-' + i + '.jpg',
          status: i % 3 === 0 ? 'cancelled' : 'done', createdAt: now - i * 500000, completedAt: now - i * 490000,
          originalWidth: 640, originalHeight: 480, newWidth: 2560, newHeight: 1920,
          model: i % 2 === 0 ? 'animesharp' : 'realesrgan-x4', scale: 4,
          outputSizeBytes: 1200000 * i, outputPath: 'D:/out/batch-' + i + '.jpg', scaleConfig: cfg
        })
      }
      localStorage.setItem('astros-upscale:history', JSON.stringify(entries))
      localStorage.setItem('astros-upscale:history-limit', '200')

      // Minimal stub so hasNativeApi (= !!window.api) is true and the editor's model
      // fetch actually runs in this plain-browser preview — only the methods the
      // views call synchronously at mount/render time need to exist.
      window.api = {
        toFileUrl: function (p) { return 'about:blank' },
        selectFiles: function () { return Promise.resolve({ canceled: true, files: [], rejected: [] }) },
        selectFolder: function () { return Promise.resolve({ canceled: true, files: [], rejected: [] }) },
        selectOutputFolder: function () { return Promise.resolve(null) },
        statPath: function () { return Promise.resolve(null) },
        getAppPaths: function () { return Promise.resolve({ documents: 'C:/Documents', repoRoot: 'D:/repo', apiBaseUrl: 'http://127.0.0.1:8765' }) },
        ensureApi: function () { return Promise.resolve({ ready: true, baseUrl: 'http://127.0.0.1:8765', startedByApp: false }) }
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/devPreview.ts"></script>
  </body>
</html>
