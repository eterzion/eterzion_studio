# node_modules plano, sem o segmento `.pnpm/<pacote>@<hash>/`.
#
# O NSIS falhava com "!include: could not open file" para um arquivo que existe:
# `makensis.exe` é Win32 clássico, não usa o prefixo `\?\`, e o caminho do
# template do app-builder-lib chegava a 277 caracteres contra o limite de 260 —
# a raiz do repositório soma 101 e o segmento com hash do pnpm somava o resto.
# Sem esse segmento o mesmo caminho fica em 197.
#
# Vai aqui e não no `.npmrc` porque o pnpm 11 lê as configurações do projeto
# deste arquivo; posta no `.npmrc` a opção é silenciosamente ignorada, que foi
# o que aconteceu na primeira tentativa.
#
# O custo é real: o layout isolado do pnpm é o que pega dependência fantasma —
# pacote usado sem estar declarado no package.json. Com `hoisted` essa checagem
# some. Se a raiz do repositório ficar curta, ou `LongPathsEnabled` for ligado,
# esta linha pode voltar atrás.
nodeLinker: hoisted

packages:
  - '.'

allowBuilds:
  electron: true
  electron-winstaller: true
  esbuild: true

overrides:
  # GHSA-mwcw-c2x4-8c55 — postcss's nanoid dependency, custom generators loop
  # indefinitely when size is zero. Fixed upstream in nanoid 3.3.18.
  nanoid@<3.3.18: '>=3.3.18'

  # fast-uri chega por ajv <- app-builder-lib <- electron-builder, e xmldom por
  # plist pela mesma raiz. Só devDependency: nada disto vai no app empacotado,
  # o alcance é a máquina que builda (a CI e a sua).
  #
  # Override e não bump do pai porque não há bump: electron-builder e ajv já
  # estão nas versões mais recentes, e é a mais recente que traz a versão
  # vulnerável. As correções cabem nos ranges pedidos (ajv: `^3.0.1`, plist:
  # `^0.8.8`), então isto não força incompatibilidade — só impede a resolução
  # de escolher uma versão vulnerável dentro do range que já era aceito.
  #
  # O teto (`<4`, `<0.9`) é o que mantém essa promessa: sem ele o pnpm
  # resolveu fast-uri 4.1.4 e xmldom 0.9.12, ambos FORA do que os pais
  # pedem — deixando de ser uma correção de segurança dentro do range
  # para virar um salto de major imposto a uma dependência de terceiro.
  #
  # GHSA-5jgf-p345-68v8, GHSA-f65p-4m7j-42xc, GHSA-fph4-wmhf-6fwf,
  # GHSA-jqff-g426-hqxp — SSRF e confusão de host por normalização de IDN,
  # IPv6 malformado e esquema percent-encoded.
  fast-uri@<3.1.6: '>=3.1.6 <4'

  # GHSA-6gmq-8vp8-gcm6 — injeção de fragmento XML por EntityReference.nodeName
  # inválido.
  '@xmldom/xmldom@<0.8.15': '>=0.8.15 <0.9'

  # js-yaml chega por electron-updater, que VAI no app empacotado: e' com ele
  # que o updater le o `latest.yml` baixado das releases, na maquina de cada
  # usuario. Tambem chega por app-builder-lib/builder-util/dmg-builder (build).
  #
  # Override porque o Dependabot nao consegue: a atualizacao de seguranca
  # dele terminava em `security_update_not_possible` a cada push na main.
  # Todos os pais pedem `^4.1.0`, entao 4.3.2 cabe no range. O teto `<5`
  # pelo mesmo motivo do fast-uri acima: a `latest` do js-yaml e' a 5.x, e
  # sem teto o override viraria um salto de major imposto aos pais.
  #
  # GHSA-2883-xcg3-v3hh — `maxTotalMergeKeys` nao limita o uso de CPU quando
  # as fontes de merge estao vazias.
  js-yaml@<4.3.2: '>=4.3.2 <5'
