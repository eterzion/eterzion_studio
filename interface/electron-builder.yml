appId: com.eterzion.studio
productName: Eterzion Studio
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!scripts/**'
  - '!release-notes/**'
  # resources/ffmpeg/<platform> is copied to the packaged resources dir via the
  # per-platform extraResources below (not through the app.asar), so exclude it
  # here to avoid bundling every platform's binaries into every installer.
  - '!resources/ffmpeg/**'
  - '!resources/backend/**'
asarUnpack:
  - resources/**
win:
  executableName: eterzion-studio
  # Gerado de `resources/icon.png` (512x512) com as sete resoluções que o Windows
  # pede — 16 a 256. Sem ele o build avisava "default Electron icon is used" e o
  # instalador saía com o ícone do Electron, o que num produto pago é a primeira
  # coisa que a pessoa vê. Um .ico de tamanho único também não serve: o sistema
  # reescala e borra justamente nos tamanhos pequenos, que são os mais vistos.
  icon: build/icon.ico
  # Assina sempre. Um instalador sem assinatura não deve ser produzível por
  # acidente: ele sai parecendo pronto e cada usuário encontra o SmartScreen.
  #
  # Para um build local de desenvolvimento, sem certificado, é preciso pedir
  # explicitamente:
  #     pnpm run build:win:unsigned
  #
  # A sobrescrita pela linha de comando precisa do caminho completo
  # (`--config.win.forceCodeSigning=false`): sem o `win.` o electron-builder
  # ignora a flag em silêncio e falha dizendo que a opção continua ligada.
  # Pedir explicitamente é o ponto — quem faz isso sabe que o resultado não pode
  # ser distribuído.
  forceCodeSigning: true
  # LGPL FFmpeg build (win64-lgpl-shared, no --enable-gpl/--enable-nonfree) fetched
  # by `npm run fetch:ffmpeg:win` (scripts/fetch-ffmpeg.mjs) ahead of packaging.
  # See docs/models/MODEL_LICENSES.md §5 for the licensing verification.
  extraResources:
    - from: resources/backend/win32/eterzion-studio-api
      to: backend
    # Os modelos NAO vao mais no instalador -- eram 68 MB de 424.
    #
    # Eles sempre foram só um cache pré-preenchido: os quatro de upscale têm
    # `urls` + `sha256` em `MODELS`, e o detector de rosto (YuNet) é baixado
    # pelo construtor do `FaceEnhancer`, também com sha256. Nenhum some para
    # sempre ao sair daqui.
    #
    # O que faltava era o outro lado: sem uma tela, quem baixasse um modelo
    # não teria como removê-lo nem como saber o que ocupava disco. As duas
    # rotas existiam (DELETE /components/{id}) e nenhuma interface as usava.
    # A ComponentsView fechou isso, então a troca deixou de ser 68 MB de
    # instalador por arquivos que se acumulam sem forma de limpar.
    #
    # O primeiro uso de cada capacidade agora baixa o modelo. É a mesma espera
    # que o `1xDeH264_realplksr` já tinha, e a tela de Componentes permite
    # antecipá-la para quem preferir baixar tudo antes.
    - from: resources/ffmpeg/win32
      to: ffmpeg
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  # Instalador assistido: pergunta para quem instalar, onde, e as opcoes da
  # pagina propria em build/installer.nsh (atalho na area de trabalho e baixar
  # os modelos depois de ativar). Quem ja' tem o app recebe as versoes novas
  # pelo electron-updater em modo silencioso (/S --updated): nenhuma pagina
  # aparece, e o instalador reusa a pasta gravada em InstallLocation.
  oneClick: false
  allowToChangeInstallationDirectory: true
  # "Para todos os usuarios" e' oferecido, com "so' para mim" marcado. Quem
  # escolhe "todos" instala em Program Files e passa a ver o pedido de
  # administrador em cada atualizacao -- a pagina de Opcoes avisa. A licenca
  # continua por conta do Windows: cada uma ativa a sua.
  perMachine: false
  allowElevation: true
  selectPerMachineByDefault: false
  # `true`, e nao `always`: o template cria o atalho na instalacao nova e o
  # remove na desinstalacao; a caixa desmarcada o apaga no customInstall. Numa
  # atualizacao nenhum dos dois recria atalho, entao a escolha se mantem.
  createDesktopShortcut: true
  runAfterFinish: true
  # Os 11 idiomas do app, no idioma do Windows e sem perguntar. Ingles primeiro
  # porque e' o que o NSIS usa quando o idioma do sistema nao esta' na lista.
  # `zh_CN`, e nao `zh-Hans`: o electron-builder nao reconhece o segundo.
  installerLanguages:
    - en_US
    - pt_BR
    - pt_PT
    - es_ES
    - fr_FR
    - de_DE
    - it_IT
    - ja_JP
    - ko_KR
    - ru_RU
    - zh_CN
  multiLanguageInstaller: true
  displayLanguageSelector: false
  # A faixa da esquerda das paginas de boas-vindas e de conclusao. Sem estes
  # arquivos o electron-builder cai na arte generica do NSIS (nsis3-metro.bmp:
  # um quadrado riscado e uma seta entrando num notebook, em azul) -- a
  # primeira tela do produto era de outro produto. Gerados do icone do app por
  # build/gerar-imagens-do-instalador.py.
  installerSidebar: build/installerSidebar.bmp
  uninstallerSidebar: build/uninstallerSidebar.bmp
  include: build/installer.nsh
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
  # No bundled FFmpeg on macOS yet: there is no BtbN-equivalent official LGPL
  # build for macOS to pin/verify against. The app falls back to a PATH-installed
  # ffmpeg on this platform. See docs/models/MODEL_LICENSES.md §5.
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  # AppImage e .deb, os dois atualizados pelo electron-updater a partir do CDN
  # (latest-linux.yml). O Flatpak vem depois, por um repositorio proprio -- o
  # electron-updater nao o atualiza. O snap saiu: nao esta' nos formatos
  # decididos e exigiria a Snap Store.
  target:
    - AppImage
    - deb
  executableName: eterzion-studio
  # O WM_CLASS da janela igual ao nome do .desktop: sem isto o desktop nao liga
  # a janela aberta ao icone do app no painel.
  syncDesktopName: true
  # A mesma arte 512x512 do icone do Windows (resources/icon.png).
  icon: resources/icon.png
  maintainer: Eterzion <contato@eterzion.com>
  vendor: Eterzion
  synopsis: Melhoria de imagens, vídeos e áudio com IA
  category: AudioVideo
  # LGPL FFmpeg build (linux64-lgpl-shared, no --enable-gpl/--enable-nonfree) fetched
  # by `npm run fetch:ffmpeg:linux` (scripts/fetch-ffmpeg.mjs) ahead of packaging.
  # See docs/models/MODEL_LICENSES.md §5 for the licensing verification.
  extraResources:
    - from: resources/backend/linux/eterzion-studio-api
      to: backend
    - from: resources/ffmpeg/linux
      to: ffmpeg
appImage:
  artifactName: ${name}-${version}.${ext}
# Runtime novo do AppImage (type2 estatico, 20251108). O padrao (0.0.0) exige
# a libfuse2 do sistema, que o Ubuntu 22.04+ nao traz mais: o AppImage abria
# com "dlopen(): error loading libfuse.so.2" num Ubuntu 24.04 limpo (testado).
toolsets:
  appimage: '1.0.3'
deb:
  artifactName: ${name}_${version}_${arch}.${ext}
npmRebuild: false
# De onde o app instalado se atualiza: o CDN privado do Studio (bucket R2 atras
# do Worker de cdn.eterzion.com). Isto so' vai para o `app-update.yml`; em tempo
# de execucao o updater.ts reaponta o feed a cada verificacao, com a credencial
# que o servidor de licencas emite (so' licenca ativa). O upload para o R2 e'
# feito pela esteira (release.yml), nao pelo electron-builder.
#
# Historico: ate' a 1.1.1 o feed era o repositorio privado (404 sem login -- nenhum
# app se atualizava); a 1.1.2 e a 1.1.3 usaram um repositorio publico do GitHub.
publish:
  provider: generic
  url: https://cdn.eterzion.com/studio/updates
  useMultipleRangeRequest: false
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
